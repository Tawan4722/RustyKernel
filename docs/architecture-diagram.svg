<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 500 13px Arial, sans-serif; fill: #374151; }
      .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; ry: 10; }
      .box2 { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 10; ry: 10; }
      .box3 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 10; ry: 10; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="40" y="50" class="title">RustyKernel Architecture Diagram</text>

  <rect class="box" x="80" y="110" width="240" height="80"/>
  <text x="155" y="155" class="label">UEFI Firmware</text>

  <rect class="box" x="390" y="110" width="260" height="80"/>
  <text x="458" y="155" class="label">Limine Bootloader</text>

  <rect class="box2" x="760" y="90" width="260" height="90"/>
  <text x="824" y="130" class="label">kernel.elf</text>
  <text x="815" y="155" class="small">Rust kernel entry: _start</text>

  <rect class="box2" x="1080" y="90" width="240" height="90"/>
  <text x="1145" y="130" class="label">user-smoke.elf</text>
  <text x="1130" y="155" class="small">Ring3 smoke module</text>

  <line class="arrow" x1="320" y1="150" x2="390" y2="150"/>
  <line class="arrow" x1="650" y1="140" x2="760" y2="135"/>
  <line class="arrow" x1="650" y1="165" x2="1080" y2="140"/>

  <rect class="box3" x="110" y="280" width="220" height="90"/>
  <text x="187" y="318" class="label">boot.rs</text>
  <text x="137" y="343" class="small">Limine requests + snapshot</text>

  <rect class="box3" x="370" y="280" width="250" height="90"/>
  <text x="455" y="318" class="label">gdt.rs</text>
  <text x="410" y="343" class="small">GDT/TSS + segment selectors</text>

  <rect class="box3" x="660" y="280" width="260" height="90"/>
  <text x="738" y="318" class="label">interrupts.rs</text>
  <text x="705" y="343" class="small">IDT + PIC + timer + syscall vec</text>

  <rect class="box3" x="960" y="280" width="250" height="90"/>
  <text x="1038" y="318" class="label">memory.rs</text>
  <text x="1003" y="343" class="small">Frame allocator + heap mapping</text>

  <line class="arrow dashed" x1="890" y1="180" x2="220" y2="280"/>
  <line class="arrow dashed" x1="890" y1="180" x2="495" y2="280"/>
  <line class="arrow dashed" x1="890" y1="180" x2="790" y2="280"/>
  <line class="arrow dashed" x1="890" y1="180" x2="1085" y2="280"/>

  <rect class="box3" x="210" y="470" width="240" height="90"/>
  <text x="280" y="508" class="label">scheduler.rs</text>
  <text x="240" y="533" class="small">Timer-driven kernel task loop</text>

  <rect class="box3" x="510" y="470" width="240" height="90"/>
  <text x="594" y="508" class="label">syscall.rs</text>
  <text x="551" y="533" class="small">Minimal POSIX-like ABI v1</text>

  <rect class="box3" x="810" y="470" width="270" height="90"/>
  <text x="890" y="508" class="label">userspace.rs</text>
  <text x="845" y="533" class="small">ELF load + ring3 transition</text>

  <line class="arrow" x1="790" y1="370" x2="330" y2="470"/>
  <line class="arrow" x1="790" y1="370" x2="630" y2="470"/>
  <line class="arrow" x1="1085" y1="370" x2="945" y2="470"/>
  <line class="arrow" x1="330" y1="560" x2="630" y2="560"/>
  <line class="arrow" x1="945" y1="470" x2="630" y2="470"/>

  <rect class="box2" x="300" y="650" width="780" height="120"/>
  <text x="560" y="688" class="label">Runtime Validation Path</text>
  <text x="340" y="720" class="small">1) userspace.rs maps user-smoke.elf and enters ring3</text>
  <text x="340" y="745" class="small">2) user-smoke executes int 0x80 twice (write, exit)</text>
  <text x="340" y="770" class="small">3) syscall.rs + scheduler.rs observe exit and continue kernel loop</text>

  <line class="arrow" x1="945" y1="560" x2="580" y2="650"/>
  <line class="arrow" x1="630" y1="560" x2="640" y2="650"/>
</svg>
